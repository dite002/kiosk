[Server]
; IP Server Kiosk (host TCP socket server)
; Bisa diisi manual atau gunakan fitur Auto-Scan
ServerIP=192.168.3.251
Port=3000

[Network]
; Auto-scan range: akan scan IP dari BaseIP.1 s/d BaseIP.255
; Set AutoScan=true untuk scan otomatis saat startup
AutoScan=false
; Base IP akan diisi otomatis dari DHCP adapter jika kosong
BaseIP=

[Display]
; Path video untuk banner di Display Monitor
VideoPath=video\video.mp4
; OPSI 1: Tentukan nomor monitor secara langsung (1 untuk Layar Utama, 2 untuk TV Display/Layar Kedua)
MonitorIndex=2
; OPSI 2: Atau tentukan koordinat X manual (Misalnya Monitor 1 lebarnya 1920, maka isi 1920+100 = 2020)
ScreenX=1500

[Audio]
; Folder file suara panggilan
AudioFolder=audio
; Volume (0-1000)
Volume=1000

